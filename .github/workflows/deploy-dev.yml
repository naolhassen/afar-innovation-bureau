name: Deploy to Development (dev.afsitb.et)

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Push Database Schema
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

      - name: Build Application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.DEV_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://dev.afsitb.et
          NODE_ENV: production

      - name: Package Standalone Build
        run: |
          # Copy static assets and Prisma files into standalone
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          if [ -d "src/generated" ]; then cp -r src/generated .next/standalone/src/generated; fi
          if [ -d "node_modules/@prisma" ]; then cp -r node_modules/@prisma .next/standalone/node_modules/@prisma; fi
          if [ -d "prisma" ]; then cp -r prisma .next/standalone/prisma; fi
          
          # Create Passenger restart trigger
          mkdir -p .next/standalone/tmp
          touch .next/standalone/tmp/restart.txt

          # Compress standalone directory into one archive
          cd .next/standalone
          tar -czf ../../deploy.tar.gz .

      - name: Upload Deployment Bundle to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "dev.afsitb.et"
          overwrite: true

      - name: Extract and Restart on cPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            set -e
            cd ~/dev.afsitb.et
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz
            mkdir -p tmp
            touch tmp/restart.txt
