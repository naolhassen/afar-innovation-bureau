name: Deploy to Development (dev.afsitb.et)

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

      - name: Build Application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.DEV_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://dev.afsitb.et
          NODE_ENV: production

      - name: Deploy via SSH to cPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            set -e
            APP_DIR="$HOME/dev.afsitb.et"
            mkdir -p $APP_DIR

            cd $APP_DIR

            # Fetch latest dev branch code (directory may already contain
            # cPanel's default app files, so we can't use `git clone` here)
            if [ ! -d ".git" ]; then
              git init
            fi
            if ! git remote | grep -q '^origin$'; then
              git remote add origin https://github.com/${{ github.repository }}.git
            fi
            git fetch origin dev
            git reset --hard origin/dev
            git clean -fd -e node_modules -e .env

            # Activate the cPanel Node.js app's virtualenv (Passenger)
            # Adjust the node version path (e.g. 20) to match what you selected in cPanel
            # NOTE: activating changes the cwd as a side effect, so cd back into APP_DIR
            source $HOME/nodevenv/dev.afsitb.et/20/bin/activate
            cd $APP_DIR

            # cPanel's Node.js App config sets NODE_ENV=production
            # persistently for this app, which npm inherits here and uses to
            # silently skip devDependencies (same effect as --omit=dev), even
            # though we don't pass that flag. --include=dev overrides this.
            # devDependencies are required for `next build`'s typecheck/CSS
            # pipeline. --ignore-scripts skips the postinstall (prisma
            # generate) hook, which is run explicitly below with an absolute
            # --schema path to avoid cwd ambiguity.
            npm install --legacy-peer-deps --include=dev --ignore-scripts

            # Generate Prisma Client & push migrations
            export DATABASE_URL="${{ secrets.DEV_DATABASE_URL }}"
            export NEXTAUTH_SECRET="${{ secrets.DEV_NEXTAUTH_SECRET }}"
            export NEXTAUTH_URL="https://dev.afsitb.et"
            export NODE_ENV="production"

            npx prisma generate --schema="$APP_DIR/prisma/schema.prisma"
            npx prisma db push --schema="$APP_DIR/prisma/schema.prisma" --accept-data-loss

            # Build app on server. Turbopack fails on cPanel's jailed
            # filesystem (CageFS) with "Symlink ... points out of the
            # filesystem root", so force the classic Webpack bundler.
            # Clear any stale .next cache left over from failed Turbopack runs.
            rm -rf .next
            # Native Rust addons (e.g. @tailwindcss/oxide, lightningcss) spawn
            # a rayon thread pool sized to CPU count by default, which hits
            # cPanel's LVE process/thread (nproc) limit and panics with
            # "Resource temporarily unavailable". Cap thread pool sizes.
            export RAYON_NUM_THREADS=1
            export UV_THREADPOOL_SIZE=2
            export TOKIO_WORKER_THREADS=1
            npx next build --webpack

            deactivate

            # Restart cPanel Node.js app (Passenger)
            mkdir -p tmp
            touch tmp/restart.txt
